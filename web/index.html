<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shivani Dhotre - Flutter Developer Portfolio">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Shivani Dhotre">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="shortcut icon" type="image/png" href="app_logo.png"/>
  <link rel="icon" type="image/png" href="app_logo.png"/>

  <title>Shivani Dhotre</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0d4a5a;
    }

    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #0d4a5a;
      gap: 24px;
    }

    #loading h1 {
      color: #CEE4FD;
      font-family: sans-serif;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    #loading p {
      color: rgba(255,255,255,0.6);
      font-family: sans-serif;
      font-size: 14px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(206, 228, 253, 0.2);
      border-top-color: #CEE4FD;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>Shivani Dhotre</h1>
    <p>Flutter Developer</p>
  </div>

  <script>
    // Remove loading screen once Flutter renders first frame
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.4s ease';
        setTimeout(function() { loading.remove(); }, 400);
      }
    });

    // Service worker for PWA / caching
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
  </script>
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
